<!--
CStatic's Very Condensed Character Box Template 
[All major parts are labeled with comments for your convenience.]
-->

<div id="user_charbox" class="container mb-3" style="max-width:600px;">
    <div>
        <div id="user_charboxtop" class="d-flex justify-content-center" style="font-size:1.5rem;">

            <!-- CHARACTER NAME -->
            <div class="font-weight-bold p-2 text-left" style="font-variant:small-caps;">Character Name</div>
            <!-- / CHARACTER NAME END -->

            <div class="flex-grow-1 card my-auto bg-secondary"></div>

            <!-- TOP RIGHT ICON -->
            <div class="p-2"><i class="fa-regular fa-heart"></i></div>
            <!-- / TOP RIGHT ICON END -->

        </div>

        <div id="user_charboxmiddle" class="d-flex no-gutters justify-content-center">
            <div id="user_leftbox" class="col-2 mx-1 align-self-center">
                <div id="user_charimage">

                    <!-- CHARACTER IMAGE -->
                    <img src="https://images.artfight.net/character/th_2txL4HImGLhJVpYecVOMB9xsrIFLOuExUmcJZnKTf5Zwvy4DXPkOyekywIfH.png"
                        class="rounded-circle img-thumbnail" style="width:100px;" alt="Character Profile Picture">
                    <!-- / CHARACTER IMAGE END -->

                </div>
            </div>

            <div id="user_rightbox" class="col mx-1 align-self-end">
                <div class="d-flex justify-content-center" style="height:65px;">
                    <div class="align-self-start" style="font-size:1.1rem;"><i class="fa-solid fa-quote-left"></i>
                    </div>

                    <!-- CHARACTER QUOTE -->
                    <div class="px-1 align-self-center font-italic text-center font-weight-bold">Quote from the
                        character that encompases who they are. Having just one or two lines is ideal!
                    </div>
                    <!-- / CHARACTER QUOTE END -->

                    <div class="align-self-end" style="font-size:1.1rem;"><i class="fa-solid fa-quote-right"></i>
                    </div>
                </div>

                <!-- CHARACTER QUOTE ATTRIBUTION -->
                <div id="user_quotecite" class="text-right mr-5" style="color:grey;">
                    &mdash;<span style="font-variant:small-caps;"><strong>Character</strong></span>, doing <span
                        style="font-variant:small-caps;"><strong>thing</strong></span>.
                </div>
                <!-- / CHARACTER QUOTE ATTRIBUTION END -->

            </div>
        </div>

        <div id="user_infobadges" class="m-2" style="font-size:1.1rem;font-variant:small-caps;">

            <!-- CHARACTER TAGS -->
            <span class="badge badge-pill badge-primary">Pronouns</span>
            <span class="badge badge-pill badge-primary">Age</span>
            <span class="badge badge-pill badge-primary">Species</span>
            <span class="badge badge-pill badge-warning">Other</span>
            <span class="badge badge-pill badge-warning">Information</span>
            <!-- / CHARACTER TAGS END -->

            <!-- CREDITS -->
            <div class="d-flex my-1">
                <div class="flex-grow-1 card my-auto bg-secondary"></div>
                <a class="ml-2" style="font-variant:normal;font-size:0.8rem;color:grey;"
                    href="https://toyhou.se/39846642.art-fight-character-box-f2u">
                    <i class="fa-solid fa-code"></i>
                </a>
            </div>
            <!-- / CREDITS END -->

        </div>
    </div>
</div>

<!-- / CODE END -->
